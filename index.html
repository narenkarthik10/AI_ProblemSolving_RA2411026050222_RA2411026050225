<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Route Finder (A* Search) - Visual Edition</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24; /* Dark theme background */
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { color: #a1b0ff; margin-bottom: 10px; }
        
        /* The Graph Container */
        #mynetwork {
            width: 800px;
            height: 500px;
            background-color: #2b2b36;
            border: 2px solid #3f3f4e;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            margin-bottom: 20px;
        }

        /* Control Panel */
        .controls {
            width: 800px;
            background: #2b2b36;
            padding: 20px;
            border-radius: 12px;
            box-sizing: border-box;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
        }
        .form-group { display: flex; align-items: center; gap: 10px; }
        label { font-weight: bold; color: #b4b4cc; }
        select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #4f4f66;
            background: #1e1e24;
            color: white;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            background-color: #5a67d8;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background-color: #4c51bf; }
        
        .result {
            width: 100%;
            margin-top: 15px;
            padding: 15px;
            background-color: #1e1e24;
            border: 1px solid #4f4f66;
            border-radius: 6px;
            font-size: 16px;
            line-height: 1.5;
            display: none;
        }
        .instructions {
            width: 800px;
            text-align: center;
            color: #8b8b9f;
            margin-bottom: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h2>Interactive GPS Route Finder</h2>
    <div class="instructions">Click "Edit" on the graph to add/remove locations (nodes) and roads (edges).</div>
    
    <div id="mynetwork"></div>

    <div class="controls">
        <div class="form-group">
            <label for="start">Start Location:</label>
            <select id="start"></select>
        </div>
        <div class="form-group">
            <label for="goal">Destination:</label>
            <select id="goal"></select>
        </div>
        <button onclick="findRoute()">Find Optimal Route</button>
        <div id="output" class="result"></div>
    </div>

    <script>
        // 1. Initial Map Data (Same as Problem 11)
        const initialNodes = [
            { id: 'A', label: 'A\n(h=7)', h: 7, x: -200, y: 0 },
            { id: 'B', label: 'B\n(h=6)', h: 6, x: 0, y: -100 },
            { id: 'C', label: 'C\n(h=4)', h: 4, x: 0, y: 100 },
            { id: 'D', label: 'D\n(h=2)', h: 2, x: 200, y: 0 },
            { id: 'E', label: 'E\n(h=1)', h: 1, x: 300, y: -100 },
            { id: 'F', label: 'F\n(h=0)', h: 0, x: 400, y: 0 }
        ];

        const initialEdges = [
            { id: 'A-B', from: 'A', to: 'B', label: '1', cost: 1 },
            { id: 'A-C', from: 'A', to: 'C', label: '4', cost: 4 },
            { id: 'B-D', from: 'B', to: 'D', label: '2', cost: 2 },
            { id: 'B-E', from: 'B', to: 'E', label: '5', cost: 5 },
            { id: 'C-D', from: 'C', to: 'D', label: '1', cost: 1 },
            { id: 'D-F', from: 'D', to: 'F', label: '3', cost: 3 },
            { id: 'E-F', from: 'E', to: 'F', label: '1', cost: 1 }
        ];

        // 2. Setup Vis-Network Datasets
        let nodes = new vis.DataSet(initialNodes);
        let edges = new vis.DataSet(initialEdges);

        // 3. Graph Styling & Options
        let container = document.getElementById('mynetwork');
        let data = { nodes: nodes, edges: edges };
        let options = {
            nodes: {
                shape: 'circle',
                color: { background: '#9ae6b4', border: '#ffffff', highlight: '#fbd38d' },
                font: { color: '#000000', face: 'Arial', bold: true },
                size: 30,
                borderWidth: 2
            },
            edges: {
                color: { color: '#718096', highlight: '#63b3ed' },
                font: { color: '#ffffff', size: 16, strokeWidth: 0 },
                width: 3,
                arrows: { to: { enabled: true, scaleFactor: 0.5 } } // Directed graph
            },
            physics: false, // Turn off bouncy physics for a stable map
            manipulation: {
                enabled: true, // ENABLES THE EDIT GUI
                addNode: function (nodeData, callback) {
                    let name = prompt("Enter Location Name (e.g., G):", "G");
                    if (!name) return;
                    let h = prompt("Enter Heuristic (estimated distance to goal):", "0");
                    nodeData.id = name;
                    nodeData.label = `${name}\n(h=${h})`;
                    nodeData.h = parseInt(h);
                    callback(nodeData);
                    updateDropdowns();
                },
                addEdge: function (edgeData, callback) {
                    if (edgeData.from === edgeData.to) return;
                    let cost = prompt(`Enter distance cost from ${edgeData.from} to ${edgeData.to}:`, "1");
                    if (!cost) return;
                    edgeData.label = cost;
                    edgeData.cost = parseInt(cost);
                    edgeData.id = `${edgeData.from}-${edgeData.to}`;
                    callback(edgeData);
                }
            }
        };

        let network = new vis.Network(container, data, options);

        // 4. Keep Dropdowns Updated
        function updateDropdowns() {
            let startSelect = document.getElementById("start");
            let goalSelect = document.getElementById("goal");
            startSelect.innerHTML = "";
            goalSelect.innerHTML = "";
            
            nodes.get().forEach(n => {
                startSelect.add(new Option(n.id, n.id));
                goalSelect.add(new Option(n.id, n.id));
            });
            // Set defaults if they exist
            if (nodes.get('A')) startSelect.value = 'A';
            if (nodes.get('F')) goalSelect.value = 'F';
        }
        updateDropdowns();

        // 5. A* Search Logic (Reads dynamically from the visual graph)
        function findRoute() {
            let start = document.getElementById("start").value;
            let goal = document.getElementById("goal").value;
            
            // Build graph mapping from current vis.js data
            let g = {};
            let hDict = {};
            
            nodes.get().forEach(n => {
                g[n.id] = {};
                hDict[n.id] = n.h || 0;
            });
            
            edges.get().forEach(e => {
                if(g[e.from]) g[e.from][e.to] = e.cost;
            });

            // Reset visual highlights
            let resetEdges = edges.get().map(e => ({ id: e.id, color: { color: '#718096' }, width: 3 }));
            edges.update(resetEdges);
            let resetNodes = nodes.get().map(n => ({ id: n.id, color: { background: '#9ae6b4' } }));
            nodes.update(resetNodes);

            // A* Algorithm
            let openSet = [{ node: start, cost: 0, f: hDict[start], path: [start] }];
            let explored = [];
            let gCosts = { [start]: 0 };
            let result = null;

            while (openSet.length > 0) {
                openSet.sort((a, b) => a.f - b.f);
                let current = openSet.shift();

                if (!explored.includes(current.node)) explored.push(current.node);

                if (current.node === goal) {
                    result = { path: current.path, cost: current.cost, explored: explored };
                    break;
                }

                let neighbors = g[current.node] || {};
                for (let neighbor in neighbors) {
                    let tentativeGCost = current.cost + neighbors[neighbor];
                    if (!(neighbor in gCosts) || tentativeGCost < gCosts[neighbor]) {
                        gCosts[neighbor] = tentativeGCost;
                        let fCost = tentativeGCost + hDict[neighbor];
                        openSet.push({ node: neighbor, cost: tentativeGCost, f: fCost, path: [...current.path, neighbor] });
                    }
                }
            }

            // Output and Highlight Results
            let outputDiv = document.getElementById("output");
            outputDiv.style.display = "block";

            if (result) {
                outputDiv.innerHTML = `<strong>Optimal Path (A*):</strong> ${result.path.join(' &rarr; ')} <br><br>
                                       <strong>Total Travel Cost:</strong> ${result.cost} <br><br>
                                       <strong>Nodes Explored:</strong> ${result.explored.join(', ')}`;
                
                // Highlight the path on the graph
                let highlightEdges = [];
                for (let i = 0; i < result.path.length - 1; i++) {
                    let from = result.path[i];
                    let to = result.path[i+1];
                    // Find edge ID (handles potential reverse edges if added by user)
                    let edge = edges.get().find(e => e.from === from && e.to === to);
                    if(edge) {
                        highlightEdges.push({ id: edge.id, color: { color: '#63b3ed' }, width: 6 });
                    }
                }
                edges.update(highlightEdges);

                // Highlight the goal node
                nodes.update({ id: goal, color: { background: '#f6ad55' } });

            } else {
                outputDiv.innerHTML = `<span style="color: #fc8181; font-weight: bold;">No valid path exists between these locations.</span>`;
            }
        }
    </script>
</body>
</html>
