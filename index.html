<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Navigation System | A* Algorithm</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 350px 800px;
            gap: 25px;
            max-width: 1200px;
        }

        /* Styling Cards */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: fadeIn 0.6s ease-out;
        }

        h2 { margin-top: 0; font-size: 22px; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
        p.subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 25px; line-height: 1.5; }

        /* Form Controls */
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        select {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155;
            background: #0f172a; color: white; font-family: 'Poppins', sans-serif;
            font-size: 15px; outline: none; transition: border 0.3s;
        }
        select:focus { border-color: var(--accent); }

        /* Main Button with Pulse Animation */
        .btn-primary {
            width: 100%; padding: 14px; background: var(--accent); color: white;
            border: none; border-radius: 8px; font-size: 16px; font-weight: 600;
            cursor: pointer; transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-2px); }
        .btn-primary:active { transform: translateY(0); }

        /* Custom Map Editor Tools */
        .toolbar { display: flex; gap: 10px; margin-bottom: 15px; justify-content: center;}
        .tool-btn {
            background: #334155; color: white; border: none; padding: 10px 15px;
            border-radius: 8px; cursor: pointer; font-size: 13px; font-family: 'Poppins', sans-serif;
            transition: all 0.2s; display: flex; align-items: center; gap: 6px;
        }
        .tool-btn:hover { background: #475569; }
        .tool-btn.danger:hover { background: var(--danger); }

        /* Map Canvas */
        #mynetwork {
            width: 100%; height: 500px; background: #0f172a; border-radius: 12px;
            border: 1px solid #334155; outline: none;
        }

        /* Results Box */
        .result-box {
            margin-top: 25px; padding: 20px; background: rgba(16, 185, 129, 0.1);
            border-left: 4px solid var(--success); border-radius: 8px;
            display: none; font-size: 15px; animation: slideUp 0.4s ease-out;
        }
        .result-box span { color: var(--success); font-weight: 600; }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="dashboard">
        
        <div class="card">
            <h2><i class="fa-solid fa-route" style="color: var(--accent);"></i> Route Finder</h2>
            <p class="subtitle">Select your start and end points. The A* algorithm will calculate the most optimal path.</p>

            <div class="form-group">
                <label>Start Location</label>
                <select id="start"></select>
            </div>
            <div class="form-group">
                <label>Destination</label>
                <select id="goal"></select>
            </div>

            <button class="btn-primary" onclick="findRoute()">
                <i class="fa-solid fa-location-arrow"></i> Calculate Optimal Route
            </button>

            <div id="output" class="result-box"></div>
        </div>

        <div class="card">
            
            <div class="toolbar">
                <button class="tool-btn" onclick="addNode()"><i class="fa-solid fa-plus-circle"></i> Add Node</button>
                <button class="tool-btn" onclick="addEdge()"><i class="fa-solid fa-project-diagram"></i> Draw Route</button>
                <button class="tool-btn danger" onclick="deleteSelected()"><i class="fa-solid fa-trash"></i> Delete Selected</button>
            </div>

            <div id="mynetwork"></div>
        </div>

    </div>

    <script>
        // 1. Initial Map Data
        const initialNodes = [
            { id: 'A', label: 'A\n(h=7)', h: 7, x: -200, y: 0 },
            { id: 'B', label: 'B\n(h=6)', h: 6, x: -50, y: -120 },
            { id: 'C', label: 'C\n(h=4)', h: 4, x: -50, y: 120 },
            { id: 'D', label: 'D\n(h=2)', h: 2, x: 150, y: 0 },
            { id: 'E', label: 'E\n(h=1)', h: 1, x: 250, y: -120 },
            { id: 'F', label: 'F\n(h=0)', h: 0, x: 350, y: 0 }
        ];

        const initialEdges = [
            { id: 'A-B', from: 'A', to: 'B', label: '1', cost: 1 },
            { id: 'A-C', from: 'A', to: 'C', label: '4', cost: 4 },
            { id: 'B-D', from: 'B', to: 'D', label: '2', cost: 2 },
            { id: 'B-E', from: 'B', to: 'E', label: '5', cost: 5 },
            { id: 'C-D', from: 'C', to: 'D', label: '1', cost: 1 },
            { id: 'D-F', from: 'D', to: 'F', label: '3', cost: 3 },
            { id: 'E-F', from: 'E', to: 'F', label: '1', cost: 1 }
        ];

        let nodes = new vis.DataSet(initialNodes);
        let edges = new vis.DataSet(initialEdges);
        let container = document.getElementById('mynetwork');
        
        let options = {
            nodes: {
                shape: 'dot', size: 20,
                color: { background: '#3b82f6', border: '#1e293b', highlight: '#10b981' },
                font: { color: '#ffffff', face: 'Poppins', size: 14, multi: true },
                borderWidth: 3
            },
            edges: {
                color: { color: '#64748b', highlight: '#10b981' },
                font: { color: '#cbd5e1', size: 14, align: 'horizontal', background: '#0f172a' },
                width: 2, smooth: { type: 'continuous' },
                arrows: { to: { enabled: true, scaleFactor: 0.6 } }
            },
            interaction: { hover: true, tooltipDelay: 200 },
            physics: false,
            manipulation: {
                enabled: false, // Turn off ugly default UI, we use custom buttons
                addNode: function (data, callback) {
                    let name = prompt("Enter Node Name (e.g., G):");
                    if (!name) return callback(null);
                    let h = prompt(`Enter estimated distance to goal for ${name}:`, "0");
                    data.id = name;
                    data.label = `<b>${name}</b>\n(h=${h})`;
                    data.h = parseInt(h) || 0;
                    callback(data);
                    updateDropdowns();
                },
                addEdge: function (data, callback) {
                    if (data.from === data.to) return callback(null);
                    let cost = prompt(`Enter travel cost from ${data.from} to ${data.to}:`, "1");
                    if (!cost) return callback(null);
                    data.label = cost;
                    data.cost = parseInt(cost) || 1;
                    data.id = `${data.from}-${data.to}`;
                    callback(data);
                }
            }
        };

        let network = new vis.Network(container, { nodes, edges }, options);

        // Custom Toolbar Functions
        function addNode() { network.addNodeMode(); }
        function addEdge() { network.addEdgeMode(); }
        function deleteSelected() { network.deleteSelected(); updateDropdowns(); }

        // Dropdown Auto-updater
        function updateDropdowns() {
            let startSelect = document.getElementById("start");
            let goalSelect = document.getElementById("goal");
            startSelect.innerHTML = ""; goalSelect.innerHTML = "";
            nodes.get().forEach(n => {
                startSelect.add(new Option(n.id, n.id));
                goalSelect.add(new Option(n.id, n.id));
            });
            if (nodes.get('A')) startSelect.value = 'A';
            if (nodes.get('F')) goalSelect.value = 'F';
        }
        updateDropdowns();

        // A* Search Logic
        function findRoute() {
            let start = document.getElementById("start").value;
            let goal = document.getElementById("goal").value;
            
            let g = {}; let hDict = {};
            nodes.get().forEach(n => { g[n.id] = {}; hDict[n.id] = n.h || 0; });
            edges.get().forEach(e => { if(g[e.from]) g[e.from][e.to] = e.cost; });

            // Reset map styles
            let resetEdges = edges.get().map(e => ({ id: e.id, color: { color: '#64748b' }, width: 2 }));
            edges.update(resetEdges);
            let resetNodes = nodes.get().map(n => ({ id: n.id, color: { background: '#3b82f6' } }));
            nodes.update(resetNodes);

            let openSet = [{ node: start, cost: 0, f: hDict[start], path: [start] }];
            let explored = [];
            let gCosts = { [start]: 0 };
            let result = null;

            let outputDiv = document.getElementById("output");
            outputDiv.style.display = "none"; // Hide to trigger re-animation

            while (openSet.length > 0) {
                openSet.sort((a, b) => a.f - b.f);
                let current = openSet.shift();

                if (!explored.includes(current.node)) explored.push(current.node);

                if (current.node === goal) {
                    result = { path: current.path, cost: current.cost, explored: explored };
                    break;
                }

                let neighbors = g[current.node] || {};
                for (let neighbor in neighbors) {
                    let tentativeGCost = current.cost + neighbors[neighbor];
                    if (!(neighbor in gCosts) || tentativeGCost < gCosts[neighbor]) {
                        gCosts[neighbor] = tentativeGCost;
                        let fCost = tentativeGCost + hDict[neighbor];
                        openSet.push({ node: neighbor, cost: tentativeGCost, f: fCost, path: [...current.path, neighbor] });
                    }
                }
            }

            setTimeout(() => {
                outputDiv.style.display = "block";
                if (result) {
                    outputDiv.innerHTML = `Optimal Path: <span>${result.path.join(' &rarr; ')}</span> <br><br>
                                           Total Cost: <span>${result.cost}</span> <br><br>
                                           Nodes Explored: <span>${result.explored.join(', ')}</span>`;
                    
                    let highlightEdges = [];
                    for (let i = 0; i < result.path.length - 1; i++) {
                        let from = result.path[i], to = result.path[i+1];
                        let edge = edges.get().find(e => e.from === from && e.to === to);
                        if(edge) highlightEdges.push({ id: edge.id, color: { color: '#10b981' }, width: 5 });
                    }
                    edges.update(highlightEdges);
                    nodes.update({ id: goal, color: { background: '#10b981' } });
                    nodes.update({ id: start, color: { background: '#f59e0b' } }); // Highlight start
                } else {
                    outputDiv.style.borderLeftColor = "var(--danger)";
                    outputDiv.innerHTML = `<span style="color: var(--danger);">No valid route exists.</span>`;
                }
            }, 50); // slight delay to trigger CSS animation
        }
    </script>
</body>
</html>
